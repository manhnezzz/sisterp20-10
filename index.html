<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoa Sinh Nhật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@600;700&family=Mali:wght@500;600;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Bố cục: hai cảnh chồng lên nhau. Cảnh 1 là chữ gõ trên nền mận tối, cảnh 2 là nền hồng loang ra từ giữa màn hình,
     hoa mọc từ mặt đất ở đáy, ảnh lơ lửng bao quanh theo hình elip, hạt lấp lánh phủ lên trên cùng. */
  :root {
    --plum-deep: #1b0617;
    --plum: #3b1030;
    --rose-glow: #ffd6ea;
    --pink-50: #ffe3f0;
    --pink-100: #ffb3d6;
    --pink-200: #ff82bd;
    --pink-300: #ff5fa8;
    --berry: #b3125f;
    --ink: #5a1237;
    --font-display: 'Pacifico', 'Segoe Script', 'Brush Script MT', cursive;
    --font-ui: 'Quicksand', 'Nunito', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--plum-deep); overflow: hidden; font-family: var(--font-ui); color: var(--ink); }

  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, var(--plum) 0%, var(--plum-deep) 75%);
  }
  #stage.resetting *, #stage.resetting { transition: none !important; }

  /* ---------- Cảnh 0: thiệp 20/10 ---------- */
  #scene-card {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse 85% 75% at 50% 45%, #fff4f9 0%, #ffd2e6 55%, #ffa9d0 100%);
    transition: opacity 1s ease; overflow-y: auto;
  }
  #scene-card.gone { visibility: hidden; pointer-events: none; }
  #scene-card.open { opacity: 0; pointer-events: none; }
  .card {
    position: relative; width: min(86vw, 360px); min-width: 0; margin: auto;
    padding: 34px 28px 30px; border-radius: 24px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: linear-gradient(165deg, #fffafc 0%, #ffe6f0 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 24px 60px rgba(255,90,160,.35), 0 0 120px rgba(255,120,180,.25);
    animation: cardIn 1.4s cubic-bezier(.2,.9,.3,1) both, cardBob 6s ease-in-out 1.4s infinite;
    transition: transform 1s cubic-bezier(.5,0,.2,1), filter 1s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 10px; border-radius: 16px; pointer-events: none;
    border: 1.5px dashed rgba(255,120,175,.7);
  }
  #scene-card.open .card { transform: translateY(-30px) scale(1.12) rotate(-2deg); filter: blur(6px); animation: none; }
  .card-flower { width: 54px; height: 54px; }
  .card-title {
    margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.1;
    font-size: clamp(3.4rem, 17vw, 5.2rem); color: var(--berry); text-shadow: 0 3px 0 rgba(255,255,255,.9), 0 6px 18px rgba(255,92,154,.3);
  }
  .card-sub { margin: 0; font: 700 13px/1.4 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); text-wrap: balance; }
  .card-msg { margin: 0; font: 600 16px/1.55 var(--font-ui); color: var(--ink); max-width: 28ch; text-wrap: balance; }
  .card-photo {
  width: min(62%, 190px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 0 8px 22px rgba(255, 92, 154, .35);
}
  .card-btn {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; cursor: pointer;
    font: 700 16px/1 var(--font-ui); color: #fff; border: 0; border-radius: 999px; padding: 15px 26px;
    background: linear-gradient(135deg, #e0307f, #b3125f);
    animation: ring 2s ease-out infinite;
  }
  .card-btn:hover { filter: brightness(1.06); }
  .card-btn:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }
  .card-btn svg { flex: none; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(40px) rotate(3deg) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes cardBob { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-8px) rotate(.6deg); } }
  @keyframes ring {
    0% { box-shadow: 0 8px 20px rgba(179,18,95,.38), 0 0 0 0 rgba(255,92,154,.55); }
    70%, 100% { box-shadow: 0 8px 20px rgba(179,18,95,.38), 0 0 0 16px rgba(255,92,154,0); }
  }

  /* ---------- Cảnh 1: gõ ngày sinh ---------- */
  #scene-type {
    position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px;
    transition: opacity 1.2s ease, filter 1.2s ease, transform 1.8s ease;
  }
  #scene-type.out { opacity: 0; filter: blur(10px); transform: scale(1.06); }
  #typed {
    margin: 0; font-family: var(--font-display); font-size: clamp(2.4rem, 11vw, 6.5rem);
    line-height: 1.25; letter-spacing: .02em; text-align: center; white-space: pre-wrap;
    color: var(--rose-glow);
    text-shadow: 0 0 18px rgba(255,150,200,.75), 0 0 48px rgba(255,100,170,.45);
  }
  .caret {
    display: inline-block; width: .06em; height: .95em; margin-left: .08em; vertical-align: -.08em;
    background: var(--rose-glow); box-shadow: 0 0 12px rgba(255,150,200,.9);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #typed:not(.on) .caret { visibility: hidden; }

  /* ---------- Cảnh 2: nền hồng ---------- */
  #pink {
    position: absolute; inset: 0; z-index: 2; overflow: hidden;
    clip-path: circle(0% at 50% 62%);
    transition: clip-path 2.6s cubic-bezier(.55,.05,.25,1);
    background: radial-gradient(ellipse 80% 70% at 50% 38%, var(--pink-50) 0%, var(--pink-100) 38%, var(--pink-200) 78%, var(--pink-300) 100%);
  }
  #stage.pink-on #pink { clip-path: circle(150% at 50% 62%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .b1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax; background: #ffe3f0; }
  .b2 { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -8vmax; background: #ff9fc6; animation-delay: -6s; }
  .b3 { width: 30vmax; height: 30vmax; right: 8vw; top: -8vmax; background: #ffd0e6; animation-delay: -11s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(4vmax, 3vmax) scale(1.12); } }

  /* ---------- Ảnh lơ lửng ---------- */
  #photos { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .float {
    position: absolute; width: calc(clamp(84px, 15vw, 168px) * var(--size, 1));
    transform: translate(-50%, -50%) scale(.5); opacity: 0;
    transition: opacity 1.6s ease var(--enter, 0s), transform 1.8s cubic-bezier(.2,.9,.3,1.2) var(--enter, 0s);
  }
  #photos.show .float { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .frame {
    padding: 6px; background: #fff; border-radius: 16px;
    box-shadow: 0 12px 30px rgba(190,40,110,.28), 0 2px 6px rgba(190,40,110,.18);
    animation: bob var(--dur, 7s) ease-in-out var(--delay, 0s) infinite;
  }
  .frame img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 11px; }
  @keyframes bob {
    0%, 100% { transform: translate(0,0) rotate(var(--r0, -3deg)); }
    50% { transform: translate(var(--dx, 6px), var(--dy, -14px)) rotate(var(--r1, 3deg)); }
  }

  /* ---------- Hoa ---------- */
  #flower {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; z-index: 4;
    overflow: visible; pointer-events: none; opacity: 0; transition: opacity 1.4s ease;
  }
  #stage.pink-on #flower { opacity: 1; }

  #sparkles { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  /* ---------- Nút điều khiển ---------- */
  .pill {
    font: 700 14px/1 var(--font-ui); color: var(--berry); cursor: pointer;
    background: rgba(255,255,255,.62); border: 1.5px solid rgba(255,255,255,.9); border-radius: 999px;
    padding: 10px 16px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(179,18,95,.16);
  }
  .pill:hover { background: rgba(255,255,255,.85); }
  .pill:focus-visible, .pill:focus-within { outline: 3px solid var(--berry); outline-offset: 2px; }
  #replay { position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
  .icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
  #musicBtn {
    position: absolute; z-index: 7;
    bottom: max(14px, env(safe-area-inset-bottom, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  }
  #musicBtn.off .ic-on, #musicBtn:not(.off) .ic-off { display: none; }
  #picker {
    position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: min(300px, 80vw);
  }
  #pickPanel {
    display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px;
    background: rgba(255,255,255,.8); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 10px 28px rgba(179,18,95,.2);
  }
  #pickPanel .pill { display: block; text-align: center; background: #fff; }
  #pickPanel p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink); }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  /* ---------- Các cảnh thông điệp ---------- */
  #scene-msg {
    position: absolute; inset: 0; z-index: 5; cursor: pointer; visibility: hidden; opacity: 0;
    transition: opacity 1.4s ease, visibility 0s linear 1.4s;
  }
  #scene-msg.on { visibility: visible; opacity: 1; transition: none; }
  #stage.in-msg #picker { opacity: 0; pointer-events: none; }
  #msgScenes { position: absolute; inset: 0; }
  .msg-scene {
    position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center;
    padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    clip-path: var(--c0); transition: clip-path 1.5s cubic-bezier(.65,0,.25,1);
  }
  .msg-scene.in { clip-path: var(--c1); }
  .r1 { --c0: circle(0% at 50% 100%); --c1: circle(150% at 50% 100%); }
  .r2 { --c0: inset(0 100% 0 0); --c1: inset(0 0 0 0); }
  .r3 { --c0: circle(0% at 50% 50%); --c1: circle(150% at 50% 50%); }
  .r4 { --c0: inset(100% 0 0 0); --c1: inset(0 0 0 0); }
  .r5 { --c0: circle(0% at 0% 0%); --c1: circle(150% at 0% 0%); }
  .msg-inner {
    position: relative; z-index: 2; min-width: 0; max-width: 100%; max-height: 100%; overflow-y: auto;
    padding: 24px 14px; display: grid; place-items: center; scrollbar-width: none;
  }
  .msg-inner::-webkit-scrollbar { display: none; }
  .deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .ic {
    position: absolute; width: var(--s); height: var(--s); color: var(--c); transform: rotate(var(--rot));
    animation: icFloat 6s ease-in-out var(--dl) infinite;
  }
  .ic svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  @keyframes icFloat {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-10px) rotate(calc(var(--rot) + 8deg)); }
  }
  .w {
    display: inline-block; opacity: 0; transform: translateY(8px);
    animation: wordIn .6s ease forwards; animation-delay: calc(var(--base, .9s) + .5s + var(--i, 0) * .06s);
  }
  @keyframes wordIn { to { opacity: 1; transform: none; } }

  #msgDots {
    position: absolute; z-index: 6; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; pointer-events: none;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
  }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--dot, #b3125f); opacity: .35; transition: width .4s ease, opacity .4s ease; }
  .dot.on { width: 24px; opacity: 1; }

  /* 1. Giấy note */
  .d1 { background-color: #ffeea0; background-image: radial-gradient(rgba(255,255,255,.6) 3px, transparent 3.5px); background-size: 34px 34px; }
  .paper {
    position: relative; width: min(86vw, 360px); padding: 44px 24px 26px 46px; border-radius: 6px 6px 14px 14px;
    background-color: #fffdf5;
    background-image: linear-gradient(transparent 31px, rgba(110,170,230,.38) 31px);
    background-size: 100% 32px; background-position: 0 12px;
    box-shadow: 0 18px 30px rgba(150,110,20,.28);
    transform: rotate(-2.5deg); animation: drop .9s cubic-bezier(.2,.9,.3,1.3) var(--base) both;
  }
  .paper::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 2px; background: rgba(255,110,150,.55); }
  .tape {
    position: absolute; top: -16px; left: 50%; width: 112px; height: 30px; margin-left: -56px; transform: rotate(-4deg);
    background: repeating-linear-gradient(45deg, #ffb3cf 0 10px, #ffd6e6 10px 20px); opacity: .92; box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .p-title { margin: 0; font: 800 28px/32px 'Baloo 2', 'Quicksand', sans-serif; color: #d62a76; }
  .p-text { margin: 0; font: 600 18px/32px 'Mali', 'Quicksand', sans-serif; color: #5b3b2e; }
  .p-note { margin-top: 4px; text-align: right; font: 400 18px/32px var(--font-display); color: #d62a76; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(-8deg); } to { opacity: 1; transform: rotate(-2.5deg); } }

  /* 2. Tin nhắn */
  .d2 {
    background: radial-gradient(circle at 20% 15%, #eaf8ff 0, transparent 40%), radial-gradient(circle at 85% 80%, #cfe9ff 0, transparent 45%), linear-gradient(180deg, #d6efff, #b3dbff);
  }
  .chat {
    width: min(90vw, 400px); border-radius: 28px; overflow: hidden; background: rgba(255,255,255,.78);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 18px 40px rgba(60,120,190,.25);
    animation: chatIn .8s cubic-bezier(.2,.9,.3,1.1) var(--base) both;
  }
  @keyframes chatIn { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #fff; border-bottom: 1.5px solid #e3f1fc; }
  .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff9ec4, #ff6fa5); }
  .avatar svg { width: 22px; height: 22px; fill: currentColor; }
  .chat-who { min-width: 0; }
  .chat-name { margin: 0; font: 800 18px/1.2 'Baloo 2', 'Quicksand', sans-serif; color: #24507a; }
  .chat-status { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; font: 600 12.5px/1.2 var(--font-ui); color: #3f6f9c; }
  .online { width: 8px; height: 8px; border-radius: 50%; background: #44c98a; }
  .chat-body { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 200px; padding: 18px 16px 24px; }
  .bubble {
    position: relative; max-width: 86%; padding: 11px 16px; border-radius: 20px 20px 20px 6px; background: #fff; color: #2b4a68;
    font: 600 16px/1.5 'Mali', 'Quicksand', sans-serif; box-shadow: 0 4px 10px rgba(60,120,190,.15);
    opacity: 0; transform: scale(.6) translateY(10px); transform-origin: left bottom;
    animation: pop .5s cubic-bezier(.2,.9,.3,1.4) var(--t) forwards;
  }
  .bubble::after { content: ""; position: absolute; left: -5px; bottom: 0; width: 14px; height: 14px; background: inherit; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .bubble.last { background: linear-gradient(135deg, #e0307f, #c2185b); color: #fff; }
  .bubble .txt { opacity: 0; animation: txtIn .01s linear calc(var(--t) + .8s) forwards; }
  .dots { position: absolute; left: 18px; top: 50%; margin-top: -4px; display: flex; gap: 5px; animation: dotsLife .85s linear var(--t) both; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #8db7dd; animation: dotBounce .6s ease-in-out var(--t) infinite; }
  .bubble.last .dots i { background: #ffd0e3; }
  .dots i:nth-child(2) { animation-delay: calc(var(--t) + .15s); }
  .dots i:nth-child(3) { animation-delay: calc(var(--t) + .3s); }
  @keyframes pop { to { opacity: 1; transform: none; } }
  @keyframes txtIn { to { opacity: 1; } }
  @keyframes dotsLife { 0%, 90% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes dotBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* 3. Bầu trời mây sao */
  .d3 { background: linear-gradient(180deg, #2f2766 0%, #6b4fb3 46%, #d58ad0 80%, #ffc4d9 100%); }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--tw) ease-in-out var(--dl) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.25); } }
  .moon { position: absolute; top: max(24px, env(safe-area-inset-top, 0px)); right: 8%; width: clamp(70px, 16vw, 110px); filter: drop-shadow(0 0 22px rgba(255,243,176,.6)); animation: bob 7s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .puff { position: absolute; left: var(--x); bottom: var(--y); width: var(--w); height: calc(var(--w) * .3); border-radius: 999px; background: #fff; opacity: .88; animation: puffDrift var(--dur) ease-in-out infinite alternate; }
  .puff::before, .puff::after { content: ""; position: absolute; border-radius: 50%; background: #fff; aspect-ratio: 1; }
  .puff::before { left: 16%; bottom: 50%; width: 38%; }
  .puff::after { right: 14%; bottom: 46%; width: 50%; }
  @keyframes puffDrift { from { transform: translateX(-6vw); } to { transform: translateX(8vw); } }
  .cloud {
    position: relative; width: min(88vw, 380px); margin-top: 40px; padding: 34px 28px 30px; border-radius: 56px; text-align: center; background: #fff;
    filter: drop-shadow(0 16px 24px rgba(40,20,90,.35));
    animation: cloudIn 1s cubic-bezier(.2,.9,.3,1.1) var(--base) both, bob 6s ease-in-out calc(var(--base) + 1s) infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; aspect-ratio: 1; }
  .cloud::before { width: 34%; left: 12%; top: -30px; }
  .cloud::after { width: 44%; right: 12%; top: -44px; }
  .c-title { position: relative; z-index: 1; margin: 0 0 10px; font: 400 30px/1.25 var(--font-display); color: #7a4fc9; }
  .c-text { position: relative; z-index: 1; margin: 0; font: 600 18px/1.6 'Mali', 'Quicksand', sans-serif; color: #4a3a78; }
  .c-note { position: relative; z-index: 1; margin: 12px 0 0; font: 400 17px/1.3 var(--font-display); color: #c23c86; }
  @keyframes cloudIn { from { opacity: 0; transform: translateY(40px) scale(.9); } to { opacity: 1; transform: none; } }

  /* 4. Phiếu quà tặng */
  .d4 { background-color: #ffd9b8; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 16px, transparent 16px 32px); }
  .ticket-wrap { filter: drop-shadow(0 16px 18px rgba(190,100,40,.35)); transform: rotate(2deg); animation: ticketIn .9s cubic-bezier(.2,.9,.3,1.15) var(--base) both; }
  @keyframes ticketIn { from { opacity: 0; transform: translateX(80px) rotate(10deg); } to { opacity: 1; transform: rotate(2deg); } }
  .ticket {
    width: min(88vw, 380px); border-radius: 20px; overflow: hidden; background: #fffaf2;
    -webkit-mask: radial-gradient(circle 13px at 0 92px, transparent 12.5px, #000 13px), radial-gradient(circle 13px at 100% 92px, transparent 12.5px, #000 13px);
    -webkit-mask-composite: source-in;
    mask: radial-gradient(circle 13px at 0 92px, transparent 12.5px, #000 13px), radial-gradient(circle 13px at 100% 92px, transparent 12.5px, #000 13px);
    mask-composite: intersect;
  }
  .tk-head { height: 92px; display: grid; place-items: center; padding: 0 28px; text-align: center; color: #fff; background: linear-gradient(135deg, #f4527f, #ee6a4a); overflow: hidden; }
  .tk-title { margin: 0; font: 800 24px/1.15 'Baloo 2', 'Quicksand', sans-serif; letter-spacing: .05em; text-transform: uppercase; text-wrap: balance; }
  .tk-body { padding: 22px 24px 8px; border-top: 2.5px dashed #ffb48a; }
  .tk-text { margin: 0; font: 600 17px/1.6 'Mali', 'Quicksand', sans-serif; color: #7a3b1d; }
  .tk-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 24px 22px; }
  .barcode { flex: 1; min-width: 0; height: 42px; border-radius: 2px; opacity: .75; background: repeating-linear-gradient(90deg, #7a3b1d 0 2px, transparent 2px 5px, #7a3b1d 5px 6px, transparent 6px 10px, #7a3b1d 10px 13px, transparent 13px 16px); }
  .stamp {
    position: relative; flex: none; width: 94px; height: 94px; padding: 10px; border-radius: 50%; display: grid; place-items: center; text-align: center;
    border: 3px solid #d62a76; color: #d62a76; font: 800 14px/1.1 'Baloo 2', 'Quicksand', sans-serif; letter-spacing: .04em; text-transform: uppercase;
    transform: rotate(-14deg); opacity: 0; animation: stamp .5s cubic-bezier(.2,.9,.3,1.4) calc(var(--base) + 1.8s) forwards;
  }
  .stamp::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dashed currentColor; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-30deg) scale(2.6); } to { opacity: .92; transform: rotate(-14deg) scale(1); } }

  /* 5. Bong bóng và trái tim */
  .d5 { background: linear-gradient(180deg, #d6fbe6 0%, #bdf1dd 55%, #a8e6d6 100%); }
  .balloon {
    position: absolute; left: var(--x); bottom: -180px; width: var(--w); height: calc(var(--w) * 1.22);
    border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.8) 0 9%, transparent 10%), var(--c);
    box-shadow: inset -6px -8px 14px rgba(0,0,0,.08); animation: rise var(--dur) linear var(--dl) infinite;
  }
  .balloon::before { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 10px; margin-left: -6px; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 70px; margin-top: 2px; background: rgba(90,70,80,.45); }
  @keyframes rise { from { transform: translate3d(0,0,0); } to { transform: translate3d(var(--sx), -130vh, 0); } }
  .heart {
    position: relative; width: min(92vw, 400px); aspect-ratio: 1.06; display: grid; place-items: center;
    filter: drop-shadow(0 18px 24px rgba(200,40,100,.3)); animation: heartIn 1s cubic-bezier(.2,.9,.3,1.3) var(--base) both, beat 2.4s ease-in-out calc(var(--base) + 1s) infinite;
  }
  .heart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .heart-in { position: relative; z-index: 1; padding: 21% 18% 24%; text-align: center; }
  .h-title { margin: 0 0 6px; font: 400 clamp(22px, 6.4vw, 28px)/1.2 var(--font-display); color: #fff; text-shadow: 0 2px 6px rgba(120,10,60,.3); }
  .h-text { margin: 0; font: 700 var(--fs, 17px)/1.5 'Mali', 'Quicksand', sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(120,10,60,.3); }
  .h-note { margin: 8px 0 0; font: 400 15px/1.3 var(--font-display); color: #ffe3f0; }
  @keyframes heartIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }

  @media (prefers-reduced-motion: reduce) {
    .frame { animation: none; transform: rotate(var(--r0, -3deg)); }
    .blob, .caret, .card, .card-btn { animation: none; }
    .ic, .star, .puff, .moon, .dots i { animation: none; }
    .cloud { animation: cloudIn 1s ease var(--base) both; }
    .heart { animation: heartIn 1s ease var(--base) both; }
    .balloon { animation: none; bottom: 8%; }
  }
</style>
</head>
<body>
<main id="stage" aria-label="Trang chúc mừng sinh nhật">

  <section id="scene-card" aria-label="Thiệp chúc mừng 20/10">
    <div class="card">
      <svg class="card-flower" viewBox="-30 -30 60 60" aria-hidden="true">
        <g fill="#ff74ad" stroke="#fff" stroke-width="1.5">
          <ellipse cx="0" cy="-13" rx="8" ry="13"/>
          <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(60)"/>
          <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(120)"/>
          <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(180)"/>
          <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(240)"/>
          <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="#ffd86b" stroke="#fff" stroke-width="1.5"/>
      </svg>
      <h1 class="card-title" id="cardTitle"></h1>
      <p class="card-sub" id="cardSub"></p>
      <img class="card-photo" src="meo24.jpg" alt="" onerror="this.hidden=true">
      <p class="card-msg" id="cardMsg"></p>
      <button class="card-btn" id="cardBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="8" width="18" height="4" rx="1"/>
          <path d="M5 12v8h14v-8M12 8v12M12 8c-1-4-6-4-5-1 .5 2 3 1 5 1zM12 8c1-4 6-4 5-1-.5 2-3 1-5 1z"/>
        </svg>
        <span id="cardBtnText"></span>
      </button>
    </div>
  </section>

  <section id="scene-type" aria-live="off">
    <p id="typed"><span id="typedText"></span><span class="caret" aria-hidden="true"></span></p>
  </section>

  <div id="pink" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <div id="photos" aria-hidden="true"></div>

  <svg id="flower" viewBox="0 0 600 900" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="gFront" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#f0408a"/><stop offset=".55" stop-color="#ff74ad"/><stop offset="1" stop-color="#ffc3dd"/>
      </linearGradient>
      <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ff7aa9"/><stop offset=".6" stop-color="#ffa6c9"/><stop offset="1" stop-color="#ffd9e8"/>
      </linearGradient>
      <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ebc3"/><stop offset="1" stop-color="#6fcf8e"/></linearGradient>
      <linearGradient id="gHillBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcf8e2"/><stop offset="1" stop-color="#a4e2b4"/></linearGradient>
      <clipPath id="photoClip"><circle r="88"/></clipPath>
    </defs>

    <path d="M-1800 1200 L-1800 850 Q-900 820 -200 846 Q400 818 1000 840 Q1600 826 2400 850 L2400 1200 Z" fill="url(#gHillBack)"/>
    <path id="stem" d="M300 960 C262 830 352 690 306 548 C282 470 300 420 300 372" fill="none" stroke="#6cc487" stroke-width="10" stroke-linecap="round"/>
    <g id="leaves"></g>

    <g id="head">
      <circle r="14" fill="#6cc487"/>
      <g id="backPetals"></g>
      <g id="frontPetals"></g>
      <g id="photoG">
        <circle r="94" cy="6" fill="rgba(179,18,95,.18)"/>
        <circle r="96" fill="#fff"/>
        <image id="centerImg" x="-88" y="-88" width="176" height="176" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
      </g>
    </g>

    <g id="ground">
      <path d="M-1800 1200 L-1800 880 Q-900 850 -300 866 Q300 840 900 866 Q1500 850 2400 880 L2400 1200 Z" fill="url(#gHill)"/>
      <g id="grass"></g>
      <g id="daisies"></g>
    </g>
  </svg>

  <canvas id="sparkles"></canvas>

  <div id="scene-msg" role="region" aria-label="Thông điệp">
    <div id="msgScenes"></div>
    <div id="msgDots" aria-hidden="true"></div>
  </div>

  <div id="picker" hidden>
    <button class="pill" id="pickToggle" type="button" aria-expanded="false" aria-controls="pickPanel">Thử ảnh của bạn</button>
    <div id="pickPanel" hidden>
      <label class="pill">Ảnh chính (trong hoa)<input class="vh" id="pickCenter" type="file" accept="image/*"></label>
      <label class="pill">Ảnh bay lơ lửng (chọn nhiều)<input class="vh" id="pickFloat" type="file" accept="image/*" multiple></label>
      <label class="pill">Nhạc nền (mp3, m4a)<input class="vh" id="pickMusic" type="file" accept="audio/*"></label>
      <p>Chỉ để xem thử trên máy bạn. Khi đưa lên web thật, đặt <b>showPhotoPicker: false</b> trong CONFIG.</p>
    </div>
  </div>
  <button class="pill" id="replay" type="button" hidden>Xem lại</button>

  <audio id="bgm" preload="auto" loop></audio>
  <button class="pill icon-btn off" id="musicBtn" type="button" aria-pressed="false" aria-label="Bật nhạc" title="Bật nhạc" hidden>
    <svg class="ic-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
    <svg class="ic-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/>
    </svg>
  </button>
</main>

<script>
/* ============================================================
   CẤU HÌNH: chỉ cần sửa phần này
   ============================================================ */
const CONFIG = {
  birthDate: "04/11/2005",   // chữ sẽ được gõ lên màn hình. Có thể dùng \n để xuống dòng
  centerPhoto: "chi.jpg",           // ảnh trong nhụy hoa, ví dụ "anh/chinh.jpg". Để trống sẽ dùng ảnh mẫu
  floatingPhotos: [          // ảnh bay lơ lửng, thêm bao nhiêu tuỳ ý. Để trống sẽ dùng 8 ảnh mẫu
     "meo34.jpg",
     "meo32.jpg",
     "meo27.jpg",
     "meo26.jpg",
     "meo25.jpg",
     "meo15.jpg",
     "meo14.jpg",
     "meo18.jpg",
  ],
  showCard: true,            // false để bỏ tấm thiệp và chạy thẳng vào hiệu ứng gõ chữ
  cardTitle: "20/10",
  cardSubtitle: "Chúc mừng ngày Phụ nữ Việt Nam",
  cardMessage: "Nhận quà nè!",
  cardButton: "Nhấn chỗ này nha",
  typingSpeedMs: 190,        // thời gian trung bình giữa hai ký tự khi gõ
  holdAfterTypingMs: 1600,   // dừng lại bao lâu sau khi gõ xong
  growSeconds: 7,            // thân hoa mọc từ đất lên (slow motion)
  pauseSeconds: 0.8,         // dừng một nhịp trước khi nụ nở
  bloomSeconds: 8,           // nụ nở bung cánh
  showPhotoPicker: false,     // nút "Thử ảnh của bạn" để xem thử ảnh. Đặt false khi đưa lên web thật

  music: "blue (sped up).mp3",                 // nhạc nền, ví dụ "nhac/bai-hat.mp3". Để trống là không có nhạc và không hiện nút loa
  musicVolume: 1,          // âm lượng từ 0 đến 1

  /* Các thông điệp chạy sau khi hoa nở xong. Mỗi mục là một cảnh, thiết kế đổi theo thứ tự:
       1 giấy note   2 tin nhắn   3 bầu trời mây sao   4 phiếu quà tặng   5 bong bóng trái tim
     title: tiêu đề.  text: nội dung, dùng \n để xuống dòng (ở cảnh 2, mỗi dòng là một bong bóng tin nhắn).
     note: dòng nhỏ tuỳ chọn. Cảnh 1 là chữ ký, cảnh 2 là trạng thái dưới tên, cảnh 3 và 5 là dòng phụ, cảnh 4 là chữ trên con dấu.
     Nội dung ngắn dưới khoảng 120 ký tự sẽ đẹp nhất. Xoá hết các mục (messages: []) nếu không muốn có phần này. */
  messages: [
    { title: "Dear sister", text: "Thank you for your companionship and care throughout this time.", note: "Brother" },
    { title: "Em trai", text: "Bữa nay về trễ nha!\nCó nấu cơm không để mua đồ ăn nè.\n Gì lạnh lùng vậy trời?", note: "đang hoạt động" },
    { title: "Lạnh lùng vậy", text: "Mong là chị em mình cởi mở hơn xíu để nói chuyện với nhau nhiều hơn.", note: "" },
    { title: "Đặt lịch", text: "Hôm nào rảnh dẫn tui đi chơi SG không?", note: "Ok" },
    { title: "Chúc mừng 20/10", text: "Chúc chị hai luôn xinh đẹp, hạnh phúc và mỉm cười thật nhiều.", note: "" }
  ],
  messageSeconds: 6,         // thời gian mỗi cảnh thông điệp. 0 là tự tính theo độ dài chữ
  holdAfterBloomMs: 3000     // dừng ngắm hoa bao lâu trước khi sang các thông điệp
};

/* ============================================================
   Tiện ích
   ============================================================ */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPD = reduceMotion ? 0.5 : 1;
const D = {
  grow: CONFIG.growSeconds * 1000 * SPD,
  pause: CONFIG.pauseSeconds * 1000 * SPD,
  bloom: CONFIG.bloomSeconds * 1000 * SPD
};

const stage = $('#stage');
const PH_COLORS = [['#ffd1e6','#ff9ec4'], ['#e5d4ff','#b79cff'], ['#ffe7c2','#ffb98a'], ['#cdeeff','#8fd0f5'], ['#d9f7de','#8fdba4']];
function placeholder(i) {
  const [a, b] = PH_COLORS[i % PH_COLORS.length];
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs>' +
    '<rect width="200" height="250" fill="url(#g)"/>' +
    '<path d="M100 150 C 40 108, 62 62, 100 92 C 138 62, 160 108, 100 150 Z" fill="#fff" fill-opacity=".85"/>' +
    '<circle cx="52" cy="48" r="5" fill="#fff" fill-opacity=".8"/><circle cx="154" cy="196" r="7" fill="#fff" fill-opacity=".7"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   Ảnh lơ lửng
   ============================================================ */
function buildPhotos(list) {
  const wrap = $('#photos');
  wrap.textContent = '';
  const rnd = mulberry32(7);
  list.forEach((src, i) => {
    const a = (-30 + i * 137.508) * Math.PI / 180;
    const k = 1 + (rnd() - .5) * .14;
    const fl = document.createElement('div');
    fl.className = 'float';
    fl.style.left = (50 + Math.cos(a) * 41 * k) + '%';
    fl.style.top = (46 + Math.sin(a) * 35 * k) + '%';
    fl.style.setProperty('--enter', (0.35 * i) + 's');
    fl.style.setProperty('--size', (0.82 + rnd() * 0.4).toFixed(2));
    const fr = document.createElement('div');
    fr.className = 'frame';
    const r0 = (rnd() - .5) * 10;
    fr.style.setProperty('--r0', r0.toFixed(1) + 'deg');
    fr.style.setProperty('--r1', (-r0 + (rnd() - .5) * 4).toFixed(1) + 'deg');
    fr.style.setProperty('--dx', ((rnd() - .5) * 30).toFixed(1) + 'px');
    fr.style.setProperty('--dy', (-(8 + rnd() * 18)).toFixed(1) + 'px');
    fr.style.setProperty('--dur', (6 + rnd() * 5).toFixed(1) + 's');
    fr.style.setProperty('--delay', (-rnd() * 8).toFixed(1) + 's');
    const img = new Image();
    img.alt = ''; img.decoding = 'async';
    img.onerror = () => { img.onerror = null; img.src = placeholder(i); };
    img.src = src || placeholder(i);
    fr.appendChild(img); fl.appendChild(fr); wrap.appendChild(fl);
  });
}
let floatingList = CONFIG.floatingPhotos.length ? CONFIG.floatingPhotos.slice() : new Array(8).fill('');
buildPhotos(floatingList);

/* ============================================================
   Hoa (SVG)
   ============================================================ */
const svg = $('#flower');
const stemPath = $('#stem');
const stemLen = stemPath.getTotalLength();
stemPath.setAttribute('stroke-dasharray', stemLen);
stemPath.setAttribute('stroke-dashoffset', stemLen);
const headG = $('#head');
const photoG = $('#photoG');
const centerImg = $('#centerImg');

function setCenter(url) {
  centerImg.setAttribute('href', url);
}
centerImg.addEventListener('error', () => {
  if (centerImg.getAttribute('href') !== placeholder(0)) setCenter(placeholder(0));
});
setCenter(CONFIG.centerPhoto || placeholder(0));

function makePetal(L, fill) {
  const a = L * .34;
  const g = document.createElementNS(NS, 'g');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', `M0 0 C ${-a} ${-L * .22}, ${-a} ${-L * .78}, 0 ${-L} C ${a} ${-L * .78}, ${a} ${-L * .22}, 0 0 Z`);
  p.setAttribute('fill', fill);
  p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-opacity', '.85');
  p.setAttribute('stroke-width', '2.5'); p.setAttribute('stroke-linejoin', 'round');
  const v = document.createElementNS(NS, 'path');
  v.setAttribute('d', `M0 ${-L * .14} Q ${L * .02} ${-L * .45} 0 ${-L * .72}`);
  v.setAttribute('fill', 'none'); v.setAttribute('stroke', '#fff'); v.setAttribute('stroke-opacity', '.4');
  v.setAttribute('stroke-width', '2.4'); v.setAttribute('stroke-linecap', 'round');
  g.appendChild(p); g.appendChild(v);
  return g;
}
const petals = [];
function addLayer(parent, n, L, fill, offsetDeg, layerDelay) {
  for (let i = 0; i < n; i++) {
    const g = makePetal(L, fill);
    parent.appendChild(g);
    let b = (i / n) * 360 - 180 + offsetDeg;
    b = ((b + 180) % 360 + 360) % 360 - 180;
    petals.push({ g, b, delay: layerDelay + 0.22 * (Math.abs(b) / 180) });
  }
}
addLayer($('#backPetals'), 12, 236, 'url(#gBack)', 15, 0);
addLayer($('#frontPetals'), 12, 214, 'url(#gFront)', 0, 0.18);

const leafDefs = [
  { f: .30, side: 1, rot: -38, s: 1.0 }, { f: .38, side: -1, rot: -38, s: .95 },
  { f: .55, side: 1, rot: -30, s: .8 },  { f: .62, side: -1, rot: -30, s: .75 }
];
const leaves = leafDefs.map(d => {
  const g = document.createElementNS(NS, 'g');
  const body = document.createElementNS(NS, 'path');
  body.setAttribute('d', 'M0 0 C 18 -30 66 -38 100 -12 C 66 14 24 20 0 0 Z');
  body.setAttribute('fill', '#7fd39a'); body.setAttribute('stroke', '#4fae73');
  body.setAttribute('stroke-width', '1.6'); body.setAttribute('stroke-linejoin', 'round');
  const vein = document.createElementNS(NS, 'path');
  vein.setAttribute('d', 'M6 -2 Q 50 -14 88 -12');
  vein.setAttribute('fill', 'none'); vein.setAttribute('stroke', '#4fae73');
  vein.setAttribute('stroke-width', '1.4'); vein.setAttribute('stroke-opacity', '.7');
  g.appendChild(body); g.appendChild(vein);
  $('#leaves').appendChild(g);
  const pt = stemPath.getPointAtLength(d.f * stemLen);
  return Object.assign({ g, x: pt.x, y: pt.y }, d);
});

(function buildGround() {
  const rnd = mulberry32(21);
  const grass = $('#grass');
  for (let i = 0; i < 46; i++) {
    const x = i < 26 ? 230 + rnd() * 140 : 10 + rnd() * 580;
    const y = 872 + rnd() * 6, h = 16 + rnd() * 20, l = (rnd() - .5) * 12;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${x - 4} ${y} Q${x - 2 + l * .3} ${y - h * .6} ${x + l} ${y - h} Q${x + 3 + l * .3} ${y - h * .55} ${x + 4} ${y} Z`);
    p.setAttribute('fill', rnd() > .5 ? '#5bbd7b' : '#7fd39a');
    grass.appendChild(p);
  }
  const daisies = $('#daisies');
  [[70, 892], [150, 884], [455, 890], [535, 882], [372, 896], [226, 898]].forEach(([x, y]) => {
    for (let k = 0; k < 5; k++) {
      const c = document.createElementNS(NS, 'circle');
      const a = k * 72 * Math.PI / 180;
      c.setAttribute('cx', x + Math.cos(a) * 5.5); c.setAttribute('cy', y + Math.sin(a) * 5.5);
      c.setAttribute('r', 4); c.setAttribute('fill', '#fff');
      daisies.appendChild(c);
    }
    const m = document.createElementNS(NS, 'circle');
    m.setAttribute('cx', x); m.setAttribute('cy', y); m.setAttribute('r', 3); m.setAttribute('fill', '#ffb04d');
    daisies.appendChild(m);
  });
})();

let flowerStart = null;
let burstDone = false;
let finished = false;
const TOTAL = D.grow + D.pause + D.bloom;

function renderFlower(now) {
  const t = flowerStart == null ? -1 : now - flowerStart;
  const p = t < 0 ? 0 : easeInOutSine(clamp(t / D.grow));
  const bt = t < 0 ? 0 : clamp((t - D.grow - D.pause) / D.bloom);
  const idle = t < 0 ? 0 : Math.max(0, t - TOTAL);

  stemPath.setAttribute('stroke-dashoffset', stemLen * (1 - p));
  const at = p * stemLen;
  const tip = stemPath.getPointAtLength(at);
  const prev = stemPath.getPointAtLength(Math.max(0, at - 6));
  const ang = Math.atan2(tip.x - prev.x, prev.y - tip.y) * 180 / Math.PI;

  const hs = (0.3 + 0.08 * p) + 0.62 * easeInOutSine(clamp(bt / 0.9));
  const sway = idle > 0 ? Math.sin(idle / 1700) * 1.6 * clamp(idle / 2000) : 0;
  headG.setAttribute('transform', `translate(${tip.x.toFixed(2)} ${tip.y.toFixed(2)}) rotate(${(ang + sway).toFixed(2)}) scale(${hs.toFixed(4)})`);

  for (const pe of petals) {
    const o = easeInOutSine(clamp((bt - pe.delay) / 0.55));
    const angle = pe.b * (0.1 + 0.9 * o);
    const breath = idle > 0 ? 1 + 0.012 * Math.sin(idle / 900 + pe.b / 30) : 1;
    const sx = (0.78 + 0.22 * o) * breath, sy = (0.9 + 0.1 * o) * breath;
    pe.g.setAttribute('transform', `rotate(${angle.toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})`);
  }

  const pl = easeOutBack(clamp((bt - 0.45) / 0.5));
  const pb = idle > 0 ? 1 + 0.015 * Math.sin(idle / 1100) : 1;
  photoG.setAttribute('transform', `scale(${Math.max(0.0001, pl * pb).toFixed(4)})`);
  photoG.setAttribute('opacity', clamp(pl * 3).toFixed(3));

  for (const l of leaves) {
    const gr = easeOutBack(clamp((p - l.f) / 0.22));
    const s = Math.max(0.0001, gr * l.s);
    const lsway = p >= 1 ? Math.sin(now / 1400 + l.f * 9) * 2.2 : 0;
    l.g.setAttribute('transform', `translate(${l.x.toFixed(2)} ${l.y.toFixed(2)}) rotate(${(l.rot * l.side + lsway * l.side).toFixed(2)}) scale(${(l.side * s).toFixed(4)} ${s.toFixed(4)})`);
  }

  if (!burstDone && bt >= 0.55) {
    burstDone = true;
    const pt = svg.createSVGPoint(); pt.x = 300; pt.y = 372;
    const m = svg.getScreenCTM();
    if (m) { const r = pt.matrixTransform(m); spawnBurst(r.x, r.y); }
  }
  if (!finished && t >= TOTAL) { finished = true; onFinished(); }
}

/* ============================================================
   Hạt lấp lánh (canvas)

const cv = $('#sparkles');
const cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
const COLORS = ['#ffffff', '#fff3b0', '#ffd0e6', '#e2d0ff', '#c9ecff', '#ffe0b3', '#ffb3d1'];
const SHAPES = ['heart', 'heart', 'sparkle', 'sparkle', 'star', 'bubble', 'flower'];
const spriteCache = {};
function drawShape(c, shape, r, color) {
  c.fillStyle = color; c.strokeStyle = color; c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = color; c.shadowBlur = 8;
  if (shape === 'heart') {
    c.beginPath(); c.moveTo(0, r * .9);
    c.bezierCurveTo(-r * 1.5, -r * .1, -r * .7, -r * 1.1, 0, -r * .45);
    c.bezierCurveTo(r * .7, -r * 1.1, r * 1.5, -r * .1, 0, r * .9);
    c.closePath(); c.fill();
  } else if (shape === 'sparkle') {
    c.beginPath(); c.moveTo(0, -r * 1.2);
    c.quadraticCurveTo(r * .14, -r * .14, r * 1.2, 0);
    c.quadraticCurveTo(r * .14, r * .14, 0, r * 1.2);
    c.quadraticCurveTo(-r * .14, r * .14, -r * 1.2, 0);
    c.quadraticCurveTo(-r * .14, -r * .14, 0, -r * 1.2);
    c.closePath(); c.fill();
  } else if (shape === 'star') {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .46 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.fill(); c.lineWidth = 4; c.stroke();
  } else if (shape === 'bubble') {
    c.globalAlpha = .22; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.globalAlpha = 1; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
    c.shadowBlur = 0; c.fillStyle = '#fff'; c.beginPath(); c.arc(-r * .35, -r * .35, r * .18, 0, 7); c.fill();
  } else if (shape === 'flower') {
    for (let k = 0; k < 5; k++) {
      const a = k * 72 * Math.PI / 180 - Math.PI / 2;
      c.beginPath(); c.arc(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .5, 0, 7); c.fill();
    }
    c.shadowBlur = 0; c.fillStyle = '#ffd86b'; c.beginPath(); c.arc(0, 0, r * .3, 0, 7); c.fill();
  }
}
function sprite(shape, color) {
  const key = shape + color;
  if (spriteCache[key]) return spriteCache[key];
  const s = document.createElement('canvas'); s.width = s.height = 96;
  const c = s.getContext('2d'); c.translate(48, 48);
  drawShape(c, shape, 26, color);
  return (spriteCache[key] = s);
}
const rndP = Math.random;
function newPart(anywhere) {
  return {
    shape: SHAPES[Math.floor(rndP() * SHAPES.length)], color: COLORS[Math.floor(rndP() * COLORS.length)],
    size: 10 + rndP() * 20, x: rndP() * W, y: anywhere ? rndP() * H : H + 30,
    vy: reduceMotion ? 0 : -(6 + rndP() * 18), amp: 8 + rndP() * 20, ws: .4 + rndP() * .8, ph: rndP() * 6.28,
    rot: rndP() * 6.28, rs: (rndP() - .5) * .8, ts: .8 + rndP() * 1.8, tp: rndP() * 6.28, base: .55 + rndP() * .45
  };
}
let parts = [], bursts = [];
function initParts() {
  parts = [];
  const n = Math.round(clamp(W * H / 17000, 36, 90));
  for (let i = 0; i < n; i++) parts.push(newPart(true));
}
function spawnBurst(x, y) {
  for (let i = 0; i < 36; i++) {
    const a = rndP() * Math.PI * 2, sp = 60 + rndP() * 180;
    bursts.push({
      shape: SHAPES[Math.floor(rndP() * SHAPES.length)], color: COLORS[Math.floor(rndP() * COLORS.length)],
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 10 + rndP() * 16, rot: rndP() * 6.28, rs: (rndP() - .5) * 2,
      age: 0, life: 1.8 + rndP() * 1.4, tp: rndP() * 6.28
    });
  }
}
let sparkTarget = 0, sparkA = 0;
function renderSparkles(t, dt) {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.clearRect(0, 0, W, H);
  sparkA += (sparkTarget - sparkA) * Math.min(1, dt * 1.2);
  if (sparkA < 0.01 && !bursts.length) return;
  for (const p of parts) {
    p.y += p.vy * dt; p.rot += p.rs * dt;
    if (p.y < -40) { Object.assign(p, newPart(false)); }
    const tw = .5 + .5 * Math.sin(t * p.ts + p.tp);
    const x = p.x + Math.sin(t * p.ws + p.ph) * p.amp;
    const sz = p.size * 1.6 * (.85 + .3 * tw);
    cx.globalAlpha = sparkA * p.base * (.3 + .7 * tw);
    cx.save(); cx.translate(x, p.y); cx.rotate(p.rot);
    cx.drawImage(sprite(p.shape, p.color), -sz / 2, -sz / 2, sz, sz);
    cx.restore();
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.age += dt;
    if (b.age >= b.life) { bursts.splice(i, 1); continue; }
    const k = Math.max(0, 1 - dt * .9);
    b.vx *= k; b.vy = b.vy * k - 10 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.rs * dt;
    const f = 1 - b.age / b.life;
    const tw = .6 + .4 * Math.sin(t * 6 + b.tp);
    const sz = b.size * 1.6 * (.6 + .4 * f);
    cx.globalAlpha = f * tw;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot);
    cx.drawImage(sprite(b.shape, b.color), -sz / 2, -sz / 2, sz, sz);
    cx.restore();
  }
  cx.globalAlpha = 1;
}

/* ============================================================
   Vòng lặp & kịch bản
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  renderFlower(now);
  renderSparkles(now / 1000, dt);
  requestAnimationFrame(loop);
}

function buildScene(m, i) {
  const kind = i % 5;
  const sc = el('div', 'msg-scene d' + (kind + 1) + ' ' + REVEALS[kind]);
  sc.style.setProperty('--base', '0.9s');
  const inner = el('div', 'msg-inner');
  sc.appendChild(inner);
  BUILD[kind](inner, sc, m);
  return sc;
}
function holdMs(m, i) {
  if (CONFIG.messageSeconds > 0) return CONFIG.messageSeconds * 1000;
  const text = String(m.text || '');
  let t = 3400 + (text.length + String(m.title || '').length) * 65;
  if (i % 5 === 1) t = Math.max(t, 3600 + text.split('\n').filter(s => s.trim()).length * 1700);
  return clamp(t, 5500, 18000);
}
let skipResolve = null, tapOkAt = 0;
function waitOrTap(ms) {
  return new Promise(res => {
    const t = setTimeout(done, ms);
    function done() { clearTimeout(t); skipResolve = null; res(); }
    skipResolve = done;
  });
}
function tapNext() {
  if (!msgRoot.classList.contains('on') || performance.now() < tapOkAt) return;
  if (skipResolve) skipResolve();
}
msgRoot.addEventListener('click', tapNext);
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'Enter'].includes(e.key) && msgRoot.classList.contains('on')) { e.preventDefault(); tapNext(); }
});

async function playMessages(id) {
  const alive = () => id === runId;
  const list = CONFIG.messages;
  stage.classList.add('in-msg');
  msgRoot.classList.add('on');
  msgDots.textContent = '';
  list.forEach(() => msgDots.appendChild(el('span', 'dot')));
  let prev = null;
  for (let i = 0; i < list.length; i++) {
    const sc = buildScene(list[i], i);
    msgScenes.appendChild(sc);
    void sc.offsetWidth;
    sc.classList.add('in');
    msgRoot.style.setProperty('--dot', DOT_COLORS[i % 5]);
    Array.from(msgDots.children).forEach((d, k) => d.classList.toggle('on', k === i));
    tapOkAt = performance.now() + 1400;
    if (prev) { const old = prev; setTimeout(() => old.remove(), 1700); }
    prev = sc;
    await waitOrTap(holdMs(list[i], i));
    if (!alive()) return;
  }
  msgRoot.classList.remove('on');
  stage.classList.remove('in-msg');
  $('#replay').hidden = false;
  setTimeout(() => { if (alive()) msgScenes.textContent = ''; }, 1600);
}

let runId = 0;
function resetAll() {
  stage.classList.add('resetting');
  void stage.offsetWidth;
  $('#typedText').textContent = '';
  $('#typed').classList.remove('on');
  $('#scene-type').classList.remove('out');
  stage.classList.remove('pink-on');
  $('#photos').classList.remove('show');
  $('#replay').hidden = true;
  msgRoot.classList.remove('on');
  stage.classList.remove('in-msg');
  msgScenes.textContent = ''; msgDots.textContent = '';
  flowerStart = null; burstDone = false; finished = false;
  sparkTarget = 0; sparkA = 0; bursts = [];
  void stage.offsetWidth;
  stage.classList.remove('resetting');
}
function onFinished() {
  const id = runId;
  if (!CONFIG.messages || !CONFIG.messages.length) { $('#replay').hidden = false; return; }
  setTimeout(() => { if (id === runId) playMessages(id); }, CONFIG.holdAfterBloomMs);
}

async function play() {
  const id = ++runId;
  const alive = () => id === runId;
  resetAll();
  await sleep(700); if (!alive()) return;
  $('#typed').classList.add('on');
  const typed = $('#typedText');
  for (const ch of Array.from(CONFIG.birthDate)) {
    typed.textContent += ch;
    await sleep(CONFIG.typingSpeedMs * (0.7 + Math.random() * 0.8));
    if (!alive()) return;
  }
  await sleep(CONFIG.holdAfterTypingMs); if (!alive()) return;
  $('#scene-type').classList.add('out');
  await sleep(1100); if (!alive()) return;
  stage.classList.add('pink-on');
  sparkTarget = 1;
  await sleep(1500); if (!alive()) return;
  $('#photos').classList.add('show');
  flowerStart = performance.now();
}

/* ============================================================
   Nút bấm
   ============================================================ */
/* ---------- Nhạc nền ---------- */
const bgm = $('#bgm');
const musicBtn = $('#musicBtn');
let musicSrc = '', userMuted = false, fadeTimer = null, resumeOnShow = false;
function setMusicUI() {
  const on = !bgm.paused;
  musicBtn.classList.toggle('off', !on);
  musicBtn.setAttribute('aria-pressed', String(on));
  const label = on ? 'Tắt nhạc' : 'Bật nhạc';
  musicBtn.setAttribute('aria-label', label); musicBtn.title = label;
}
function fadeTo(v, ms, done) {
  clearInterval(fadeTimer);
  const from = bgm.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const k = clamp((performance.now() - t0) / ms);
    bgm.volume = clamp(from + (v - from) * k);
    if (k >= 1) { clearInterval(fadeTimer); if (done) done(); }
  }, 50);
}
function setMusic(src) {
  musicSrc = src || '';
  if (!musicSrc) { musicBtn.hidden = true; return; }
  bgm.src = musicSrc;
  musicBtn.hidden = false;
  setMusicUI();
}
function playMusic() {
  bgm.volume = 0;
  const p = bgm.play();
  const ok = () => { fadeTo(clamp(CONFIG.musicVolume, 0, 1), 3000); setMusicUI(); };
  if (p && p.then) {
    p.then(ok).catch(() => {
      setMusicUI();
      document.addEventListener('pointerdown', startMusic, { once: true });
    });
  } else { ok(); }
}
function startMusic() {
  if (!musicSrc || userMuted || !bgm.paused) return;
  playMusic();
}
musicBtn.addEventListener('click', () => {
  if (bgm.paused) { userMuted = false; playMusic(); }
  else { userMuted = true; fadeTo(0, 500, () => { bgm.pause(); setMusicUI(); }); }
});
bgm.addEventListener('play', setMusicUI);
bgm.addEventListener('pause', setMusicUI);
bgm.addEventListener('error', () => { if (musicSrc) musicBtn.hidden = true; });
document.addEventListener('visibilitychange', () => {
  if (!musicSrc) return;
  if (document.hidden) { if (!bgm.paused) { resumeOnShow = true; bgm.pause(); } }
  else if (resumeOnShow) { resumeOnShow = false; if (!userMuted) bgm.play().catch(() => {}); }
});
setMusic(CONFIG.music);

const card = $('#scene-card');
$('#cardTitle').textContent = CONFIG.cardTitle;
$('#cardSub').textContent = CONFIG.cardSubtitle;
$('#cardMsg').textContent = CONFIG.cardMessage;
$('#cardBtnText').textContent = CONFIG.cardButton;

function showCard() {
  runId++;
  resetAll();
  stage.classList.add('resetting');
  card.classList.remove('open', 'gone');
  void stage.offsetWidth;
  stage.classList.remove('resetting');
  $('#cardBtn').focus({ preventScroll: true });
}
function openCard() {
  if (card.classList.contains('open')) return;
  card.classList.add('open');
  startMusic();
  setTimeout(() => { if (card.classList.contains('open')) card.classList.add('gone'); }, 1100);
  play();
}
$('#cardBtn').addEventListener('click', openCard);
$('#replay').addEventListener('click', () => CONFIG.showCard ? showCard() : play());
if (CONFIG.showPhotoPicker) {
  $('#picker').hidden = false;
  $('#pickToggle').addEventListener('click', () => {
    const panel = $('#pickPanel');
    panel.hidden = !panel.hidden;
    $('#pickToggle').setAttribute('aria-expanded', String(!panel.hidden));
  });
  $('#pickCenter').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) setCenter(URL.createObjectURL(f));
  });
  $('#pickMusic').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    userMuted = false;
    bgm.pause();
    setMusic(URL.createObjectURL(f));
    startMusic();
  });
  $('#pickFloat').addEventListener('change', e => {
    const fs = Array.from(e.target.files);
    if (!fs.length) return;
    floatingList = fs.map(f => URL.createObjectURL(f));
    buildPhotos(floatingList);
  });
}

window.addEventListener('resize', () => { resize(); initParts(); });
resize(); initParts();
renderFlower(performance.now());
requestAnimationFrame(loop);
if (CONFIG.showCard) { card.classList.remove('gone'); } else { card.classList.add('gone'); startMusic(); play(); }
</script>
</body>
